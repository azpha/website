<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- self-hosted font, declared in src/assets/main.css. preloading the
         latin regular face keeps it off the discovery critical path -->
    <link
      rel="preload"
      href="/fonts/open-sans-latin-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- images and live data come from these origins -->
    <link rel="preconnect" href="https://storage.alexav.gg" crossorigin />
    <link rel="dns-prefetch" href="https://api.alexav.gg" />

    <script
      defer
      data-domain="alexav.gg"
      src="https://metrics.alexav.gg/js/script.hash.outbound-links.js"
    ></script>

    <!-- title, description, canonical, og/twitter and JSON-LD are injected
         per route by src/utils/seo.ts. do not add page-level tags here, or
         they will be duplicated on every url. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
